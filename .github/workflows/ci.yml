name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend build
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Go tests
        run: go test ./...

      - name: Release notes tests
        shell: pwsh
        run: ./packaging/read-release-notes.test.ps1

      - name: Plugin tests
        run: node --test plugins/tests/*.test.mjs

      - name: Shared plugin copies
        run: node plugins/sync-support.mjs --check
