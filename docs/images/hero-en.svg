      </svg>
      <text x="86" y="278">Codex</text>

      <!-- Claude Code -->
      <rect x="150" y="256" width="132" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
      <svg x="162" y="265" width="16" height="16" viewBox="0 0 24 24">
        <path fill="#D97757" d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.73-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z"/>
      </svg>
      <text x="184" y="278">Claude Code</text>

      <!-- Antigravity -->
      <rect x="290" y="256" width="122" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
      <svg x="302" y="265" width="16" height="16" viewBox="10 11 92 92" fill="none">
        <path d="M89.6992 93.695C94.3659 97.195 101.366 94.8617 94.9492 88.445C75.6992 69.7783 79.7825 18.445 55.8659 18.445C31.9492 18.445 36.0325 69.7783 16.7825 88.445C9.78251 95.445 17.3658 97.195 22.0325 93.695C40.1159 81.445 38.9492 59.8617 55.8659 59.8617C72.7825 59.8617 71.6159 81.445 89.6992 93.695Z" fill="#3186FF"/>
      </svg>
      <text x="324" y="278">Antigravity</text>

      <!-- Pi -->
      <rect x="420" y="256" width="60" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
      <svg x="431" y="265" width="16" height="16" viewBox="145 145 510 510">
        <path fill="#F09082" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"/>
        <path fill="#4D9ABF" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"/>
        <path fill="#F1BE58" d="M517.36 400H634.72V634.72H517.36Z"/>
      </svg>
      <text x="453" y="278">Pi</text>
    </g>

    <!-- Row 2: Orca Sync pill with uniform style -->
    <g font-size="13.5" font-weight="600">
      <rect x="52" y="298" width="112" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
      <svg x="63" y="307" width="16" height="16" viewBox="0 0 24 24" fill="#111827">
        <path d="M14.11 5.56C14.04 5.54 13.97 5.62 13.91 5.82L11.74 13.48C11.46 14.22 10.16 14.92 8.70 15.20C7.18 15.48 5.98 14.92 4.30 14.74C3.30 14.64 2.48 15.32 1.84 16.22C1.74 16.36 1.84 16.43 2.12 16.43L8.35 16.35C9.68 16.28 10.64 16.06 11.28 15.76C11.38 15.71 11.44 15.60 11.50 15.40L14.20 5.86C14.24 5.68 14.19 5.58 14.11 5.56Z"/>
        <path d="M22.14 8.36C20.22 8.16 18.08 8.12 16.68 8.74C15.10 9.44 14.08 10.92 13.40 13.06L11.74 18.28C11.68 18.46 11.82 18.52 11.94 18.32L14.84 13.38C15.54 12.18 16.12 11.60 17.28 11.14C19.00 10.46 20.90 9.64 22.16 8.54C22.25 8.46 22.23 8.37 22.14 8.36Z"/>
        <ellipse cx="16.89" cy="7.29" rx="1.44" ry="0.52" transform="rotate(-9.3 16.89 7.29)"/>
      </svg>
      <text x="85" y="320" fill="#111827">Orca Sync</text>
      <text x="176" y="320" font-weight="400" fill="#6b7280">Sync titles to chats &amp; terminal tabs</text>
    </g>

    <line x1="52" y1="358" x2="520" y2="358" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="52" y="392" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="14" fill="#6b7280">Open Source · Releases →</text>

    <!-- Right column: white proof card (following internal/engine/naming.md rules) -->
    <g filter="url(#card-shadow-en)">
      <rect x="560" y="32" width="588" height="386" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
    </g>

    <text x="588" y="68" font-size="13" font-weight="700" letter-spacing="0.8" fill="#6b7280">SESSION DIFF · NAMING RULE</text>
    <text x="1120" y="68" text-anchor="end" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="13" fill="#6b7280">emoji subject｜goal</text>
    <line x1="588" y1="84" x2="1120" y2="84" stroke="#e5e7eb" stroke-width="1.2"/>

    <!-- Row 01 -->
    <text x="588" y="124" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="18" font-weight="700" fill="#2563eb">01</text>
    <text x="626" y="117" font-size="14" fill="#6b7280">Before: Help me debug why the login button stops...</text>
    <text x="626" y="143" font-size="18" font-weight="700" fill="#111827">🧩 Login button｜Fix click</text>
    <rect x="1032" y="110" width="88" height="28" rx="14" fill="#f1f3f6" stroke="#e5e7eb"/>
    <text x="1076" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">Codex</text>
    <line x1="588" y1="164" x2="1120" y2="164" stroke="#f1f3f6" stroke-width="1.2"/>

    <!-- Row 02 -->
    <text x="588" y="204" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="18" font-weight="700" fill="#2563eb">02</text>
    <text x="626" y="197" font-size="14" fill="#6b7280">Before: Refactor the homepage API cache key to...</text>
    <text x="626" y="223" font-size="18" font-weight="700" fill="#111827">🧩 API cache｜User scope</text>
    <rect x="1014" y="190" width="106" height="28" rx="14" fill="#f1f3f6" stroke="#e5e7eb"/>
    <text x="1067" y="209" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">Claude Code</text>
    <line x1="588" y1="244" x2="1120" y2="244" stroke="#f1f3f6" stroke-width="1.2"/>

    <!-- Row 03 -->
    <text x="588" y="284" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="18" font-weight="700" fill="#2563eb">03</text>
    <text x="626" y="277" font-size="14" fill="#6b7280">Before: Redesign the README hero banner with a...</text>
    <text x="626" y="303" font-size="18" font-weight="700" fill="#111827">🎨 README hero｜Light layout</text>
    <rect x="1014" y="270" width="106" height="28" rx="14" fill="#f1f3f6" stroke="#e5e7eb"/>
    <text x="1067" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">Antigravity</text>

    <!-- Bottom status bar -->
    <rect x="588" y="340" width="532" height="50" rx="10" fill="#f5f6f8" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="610" cy="365" r="5" fill="#059669"/>
    <text x="626" y="370" font-size="14" font-weight="600" fill="#111827">Subject first, goal second · Full-width "｜"</text>
    <text x="1102" y="370" text-anchor="end" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="13" fill="#6b7280">Token · Records · Tray</text>
  </g>
</svg>
