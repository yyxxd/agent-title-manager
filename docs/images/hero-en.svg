<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="hero-en-title hero-en-desc">
  <title id="hero-en-title">Agent Title Manager — Auto-title AI coding sessions</title>
  <desc id="hero-en-desc">A desktop app that automatically generates structured session titles (emoji subject｜goal) for Codex, Claude Code, Antigravity, and Pi, with Orca sync.</desc>
  <defs>
    <filter id="card-shadow-en" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#101828" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer canvas: tokens.css #f5f6f8 & #e5e7eb -->
  <rect x="1" y="1" width="1198" height="448" rx="22" fill="#f5f6f8" stroke="#e5e7eb" stroke-width="1.5"/>

  <g font-family="Segoe UI Variable Text, Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Left column: identity & positioning -->
    <text x="52" y="58" font-size="14" font-weight="600" letter-spacing="1.1" fill="#2563eb">DESKTOP APP · LOCAL SESSION NAMER</text>
    <line x1="52" y1="76" x2="520" y2="76" stroke="#e5e7eb" stroke-width="1.2"/>

    <text x="52" y="134" font-size="42" font-weight="800" fill="#111827" letter-spacing="-0.8">Agent Title Manager</text>
    <rect x="52" y="152" width="76" height="4" rx="2" fill="#2563eb"/>

    <text x="52" y="198" font-size="22" font-weight="700" fill="#111827">Auto-title your AI coding sessions</text>
    <text x="52" y="228" font-size="16" fill="#4b5563">Turn truncated prompts into scannable "emoji subject｜goal" titles</text>

    <!-- Row 1: 4 Agent pills with uniform style & brand icons -->
    <g font-size="13.5" font-weight="600" fill="#111827">
      <!-- Codex -->
      <rect x="52" y="256" width="90" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
      <svg x="64" y="265" width="16" height="16" viewBox="0 0 24 24" fill="#111827" fill-rule="evenodd">
